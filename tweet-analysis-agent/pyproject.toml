[project]
name = "tweet-analysis-agent"
version = "0.1.0"
description = "Multi-agent pipeline for analyzing Twitter/X bookmarks - extracts claims, fact-checks, tests strategies"
requires-python = ">=3.11"
dependencies = [
    "tweepy>=4.14,<5",
    "anthropic>=0.40,<1",
    "tavily-python>=0.5,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "solders>=0.21,<1",
    "solana>=0.34,<1",
]

[project.scripts]
analyze = "main:main"
